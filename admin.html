<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스코어보드 관리자</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a1a;
      color: #eee;
      margin: 0;
    }
    .admin-panel {
      background-color: #2a2a2a;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 400px;
      text-align: center;
    }
    h1 { margin-bottom: 30px; color: #00c3ff; }
    .control-group { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background-color: #333;
      color: white;
      font-size: 1.1em;
      box-sizing: border-box;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-save { background-color: #00c3ff; color: #111; font-weight: bold; }
    .btn-start { background-color: #00e0c6; color: #111; font-weight: bold; }
    .btn-stop { background-color: #ff4444; color: white; font-weight: bold; }
    .status-msg { margin-top: 15px; font-size: 0.9em; min-height: 20px; }
    .success { color: #00e0c6; }
    .error { color: #ff4444; }
  </style>
</head>
<body>

<div class="admin-panel">
  <h1>🛡️ 관리자 패널</h1>
  
  <div class="control-group">
    <label for="round-time">라운드 시간 (초)</label>
    <input type="number" id="round-time" value="600" min="10">
    <p style="color:#888; font-size:0.8em; margin-top:5px;">기본값: 600초 (10분)</p>
  </div>

  <div class="control-group">
    <label for="prepare-time">라운드 시작 전 대기 시간 (초)</label>
    <input type="number" id="prepare-time" value="10" min="0">
    <p style="color:#888; font-size:0.8em; margin-top:5px;">기본값: 10초</p>
  </div>

  <button class="btn btn-save" onclick="saveConfig()">설정 저장</button>
  
  <hr style="border-color:#444; margin: 25px 0;">
  
  <div class="btn-group">
    <button class="btn btn-start" onclick="controlGame('start')">게임 시작</button>
    <button class="btn btn-stop" onclick="controlGame('stop')">게임 중지</button>
  </div>
  
  <div id="status-msg" class="status-msg"></div>
</div>

<script>
  const statusEl = document.getElementById('status-msg');
  const roundInput = document.getElementById('round-time');
  const prepareInput = document.getElementById('prepare-time');

  // 초기 설정 불러오기
  fetch('/api/admin/config')
    .then(r => r.json())
    .then(data => {
      if(data.round_duration) roundInput.value = data.round_duration;
      if(data.prepare_duration !== undefined) prepareInput.value = data.prepare_duration;
    })
    .catch(e => console.error(e));

  function showMsg(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status-msg ' + type;
    setTimeout(() => { statusEl.textContent = ''; }, 3000);
  }

  function saveConfig() {
    const roundDuration = parseInt(roundInput.value);
    const prepareDuration = parseInt(prepareInput.value);

    if (isNaN(roundDuration) || roundDuration < 10) {
      showMsg('라운드 시간은 최소 10초 이상이어야 합니다.', 'error');
      return;
    }
    if (isNaN(prepareDuration) || prepareDuration < 0) {
      showMsg('대기 시간은 0초 이상이어야 합니다.', 'error');
      return;
    }

    fetch('/api/admin/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        round_duration: roundDuration,
        prepare_duration: prepareDuration 
      })
    })
    .then(r => r.json())
    .then(data => {
      if (data.status === 'success') {
        showMsg('✅ 설정이 저장되었습니다.', 'success');
      } else {
        showMsg('❌ 저장 실패: ' + (data.message || '오류'), 'error');
      }
    })
    .catch(e => showMsg('❌ 통신 오류', 'error'));
  }

  function controlGame(action) {
    if (!confirm(action === 'start' ? '게임을 시작하시겠습니까?' : '게임을 강제 종료하시겠습니까?')) return;

    fetch('/' + action)
      .then(r => r.text())
      .then(msg => {
        if (msg.includes('Access Denied')) showMsg('❌ 권한이 없습니다.', 'error');
        else if (msg.includes('실패') || msg.includes('오류')) showMsg('⚠️ ' + msg, 'error');
        else showMsg('✅ ' + msg, 'success');
      })
      .catch(e => showMsg('❌ 통신 오류', 'error'));
  }
</script>

</body>
</html>
