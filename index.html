<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>보안 룰셋 작성 실습 스코어보드</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    /* <<< --- [수정] --- >>> */
    /* 전역 글꼴 크기를 16px (1rem) 기준으로 설정 */
    :root {
      font-size: 16px;
    }
    /* <<< --- [수정 완료] --- >>> */

    #round-value, #timer-value { font-size: 56px; font-weight: 800; letter-spacing: 1px; }
    #log-box { white-space: pre-wrap; line-height: 1.5; }
    
    /* 팝업 내 텍스트 스타일 */
    #analysis-content {
      /* <<< --- [수정] --- >>> */
      font-size: 1.25rem; /* 글자 크기 키우기 (1.1em -> 1.25rem) */
      line-height: 1.8; /* 줄 간격 늘리기 (1.7 -> 1.8) */
      /* <<< --- [수정 완료] --- >>> */
      white-space: pre-wrap; /* 자동 줄바꿈 */
      color: #ddd;

      /* 스크롤 추가 */
      max-height: 60vh; /* 뷰포트(화면) 높이의 60%를 최대 높이로 */
      overflow-y: auto; /* 내용이 넘칠 경우 세로 스크롤 자동 생성 */
      padding-right: 15px; /* 스크롤바와 텍스트가 겹치지 않게 여백 추가 */
    }
    #analysis-content h1 {
      color: #00e0c6;
      /* <<< --- [수정] --- >>> */
      font-size: 1.8rem; /* (1.5em -> 1.8rem) */
      /* <<< --- [수정 완료] --- >>> */
      margin-bottom: 15px;
    }
    /* <<< --- [신규] h2 스타일 추가 --- >>> */
    #analysis-content h2 {
      color: #00e0c6;
      font-size: 1.6rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    #analysis-content h3 {
      color: #00c3ff;
      /* <<< --- [수정] --- >>> */
      font-size: 1.4rem; /* (default -> 1.4rem) */
      /* <<< --- [수정 완료] --- >>> */
      margin-top: 20px;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }
    #analysis-content h4 {
      color: #00e0c6;
      /* <<< --- [수정] --- >>> */
      font-size: 1.2rem; /* (default -> 1.2rem) */
      /* <<< --- [수정 완료] --- >>> */
      margin-top: 15px;
      margin-bottom: 5px;
    }
    
    /* 'code' 태그(노란 글씨) 스타일 변경 */
    #analysis-content code {
      /* <<< --- [수정] --- >>> */
      background-color: #333; /* 배경색 살짝 추가 */
      padding: 3px 6px; /* 여백 추가 */
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.1rem; /* (0.9em -> 1.1rem) */
      color: #f9d86a; /* 노란색 계열로 변경 */
      /* <<< --- [수정 완료] --- >>> */
    }

    /* <<< --- [신규] pre 스타일 추가 (```...``` 블록용) --- >>> */
    #analysis-content pre {
      background-color: #1a1a1a;
      border: 1px solid #444;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.1rem;
      line-height: 1.6;
      white-space: pre-wrap; /* 블록 내에서도 자동 줄바꿈 */
      word-break: break-all; /* 긴 룰이 넘치지 않도록 강제 줄바꿈 */
      color: #e0e0e0;
    }
    /* <<< --- [신규 완료] --- >>> */
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>보안 룰셋 작성 실습 스코어보드</h1>
  </header>

  <section id="final-banner" class="hidden" aria-live="polite">
    <div class="title">게임 종료</div>
    <div id="winner-line" class="winner">우승: -</div>
    <div class="congrats">축하드립니다! 🎉</div>
  </section>

  <main>
    <div class="info-panel">
      <div class="info-box">
        <h2>라운드</h2>
        <p id="round-value">대기 중</p>
      </div>
      <div class="info-box">
        <h2>남은 시간</h2>
        <p id="timer-value">00:00</p>
      </div>
    </div>

    <div class="scoreboard">
      <div id="team-A" class="team-card">
        <div class="team-label">A팀 점수</div>
        <div id="score-A" class="team-value">0</div>
      </div>
      <div id="team-B" class="team-card">
        <div class="team-label">B팀 점수</div>
        <div id="score-B" class="team-value">0</div>
      </div>
    </div>

    <div class="log-panel">
      <h2>실시간 현황</h2>
      <div id="log-box">게임이 시작되면 로그가 표시됩니다...</div>
    </div>

    <div style="margin-top: 20px;">
      <button class="btn btn-ghost hidden" id="analysis-trigger">분석 결과 보기</button>
    </div>
  </main>
</div>

<div id="submit-bar" class="submit-bar hidden">
  <a href="/submit_page" class="btn btn-primary" id="submit-btn">룰셋 제출</a>
</div>

<div id="analysis-overlay" class="overlay hidden">
  <div class="analysis-box">
    <div class="analysis-title">🔍 결과 분석</div>
    
    <div id="analysis-content">분석 데이터를 불러오는 중...</div>
    
    <button class="close-btn" id="close-analysis">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
<script>
// static/script.js

// 0초를 "MM:SS" 문자열로 포맷
function formatSeconds(sec) {
  if (typeof sec !== "number" || isNaN(sec)) sec = 0;
  if (sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

// AI 피드백 텍스트를 HTML로 변환 (Markdown 파서)
function parseFeedback(text) {
  if (!text) return "";
  
  // XSS 방지를 위해 기본 HTML 태그를 이스케이프
  let safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Markdown 변환
  // --- (구분선)
  safeText = safeText.replace(/^-{3,}/gim, '<hr style="border-color:#444; margin: 20px 0;">');
  // # {Team} ... (제목1) - h1 태그는 python 코드에서 생성합니다.
  safeText = safeText.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  // ## 라운드 ... (제목2)
  safeText = safeText.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  // ### Suricata ... (제목3)
  safeText = safeText.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  // #### (제목4)
  safeText = safeText.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
  // **문제:** ... (굵은 글씨)
  // [수정] 정규식 수정 ( ) 가 없는 경우도 처리
  safeText = safeText.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
  
  // ```...``` (코드 블록)
  // [수정] code 블록을 <pre> 태그로 감싸서 스타일 적용
  safeText = safeText.replace(/```\n(.*?)\n```/gims, '<pre>$1</pre>');
  
  // `code` (인라인 코드)
  safeText = safeText.replace(/`([^`]+)`/gim, '<code>$1</code>');
  // 줄바꿈 ( \n -> <br> )
  safeText = safeText.replace(/\n/gim, '<br>');
  
  // <pre><br>... 로 시작하는 부분에서 <br> 제거
  safeText = safeText.replace(/<pre><br>/gim, '<pre>');
  // ...<br></pre> 로 끝나는 부분에서 <br> 제거
  safeText = safeText.replace(/<br><\/pre>/gim, '</pre>');

  return safeText;
}


document.addEventListener("DOMContentLoaded", () => {
  const socket = io();

  const roundEl     = document.getElementById("round-value");
  const timerEl     = document.getElementById("timer-value");
  const scoreAEl    = document.getElementById("score-A");
  const scoreBEl    = document.getElementById("score-B");
  const logBoxEl    = document.getElementById("log-box");

  const finalBanner    = document.getElementById("final-banner");
  const winnerLineEl   = document.getElementById("winner-line");

  const submitBar      = document.getElementById("submit-bar");
  const analysisBtn    = document.getElementById("analysis-trigger");
  const analysisLayer  = document.getElementById("analysis-overlay");
  const analysisText   = document.getElementById("analysis-content"); 
  const analysisClose  = document.getElementById("close-analysis");

  let latestState = null;

  function updateUI(state) {
    latestState = state;

    // --- 라운드 및 상태 메시지 업데이트 (핵심 수정 부분) ---
    if (state.phase === "running") {
        // 작업 시간 중
        roundEl.textContent = state.current_round;
    } else if (state.phase === "reviewing") {
        // 분석 시간 중 (30초 카운트 다운)
        roundEl.textContent = `${state.current_round} (분석 중)`;
    } else {
        // waiting 또는 finished
        roundEl.textContent = "대기 중";
    }
    
    // 타이머 (모든 단계에서 state.timer 값을 사용)
    timerEl.textContent = formatSeconds(state.timer || 0);

    // 점수
    const scores = state.scores || {};
    scoreAEl.textContent = scores["A팀"] != null ? scores["A팀"] : 0;
    scoreBEl.textContent = scores["B팀"] != null ? scores["B팀"] : 0;

    // 로그
    if (state.log && state.log.length > 0) {
      logBoxEl.textContent = state.log.join("\n");
    } else {
      logBoxEl.textContent = "게임이 시작되면 로그가 표시됩니다...";
    }

    // 제출 버튼 바 - running 단계에서만 허용
    if (state.phase === "running" && state.is_submission_allowed) {
      submitBar.classList.remove("hidden");
    } else {
      submitBar.classList.add("hidden");
    }

    // 게임 종료 배너
    if (state.phase === "finished") {
      const winners = state.winners || [];
      finalBanner.classList.remove("hidden");
      if (winners.length === 0) {
        winnerLineEl.textContent = "우승: 무승부";
      } else {
        winnerLineEl.textContent = "우승: " + winners.join(", ");
      }
    } else {
      finalBanner.classList.add("hidden");
    }

    // 결과 분석 버튼
    if (state.phase === "finished" && state.feedback_ready) {
      analysisBtn.classList.remove("hidden");
    } else {
      analysisBtn.classList.add("hidden");
    }
  }

  // 소켓 이벤트
  socket.on("connect", () => {
    // 최초 연결 시 상태를 fetch하여 초기화
    fetch("/api/state")
      .then((r) => r.json())
      .then((s) => updateUI(s))
      .catch(() => {});
  });

  // 서버로부터 상태 업데이트를 받을 때마다 UI 갱신
  socket.on("update_state", (state) => {
    updateUI(state);
  });

  // 분석 결과 보기 버튼
  analysisBtn.addEventListener("click", () => {
    analysisText.innerHTML = "분석 데이터를 불러오는 중..."; 
    analysisLayer.classList.remove("hidden");

    fetch("/postgame_feedback")
      .then((r) => r.json())
      .then((data) => {
        let buf = "";
        const entries = Object.entries(data || {});
        if (entries.length === 0) {
          buf = "분석 결과가 아직 준비되지 않았습니다.";
        } else {
          for (const [team, text] of entries) {
            // A팀 분석 / B팀 분석 (h1) 제목을 추가합니다.
            buf += `<h1>${team} 분석</h1>${parseFeedback(text)}`;
          }
        }
        analysisText.innerHTML = buf.trim(); 
      })
      .catch((err) => {
        analysisText.textContent = "분석 결과를 불러오는 중 오류가 발생했습니다.\n" + err;
      });
  });

  // 분석 팝업 닫기
  analysisClose.addEventListener("click", () => {
    analysisLayer.classList.add("hidden");
  });
});
</script>
</body>
</html>
